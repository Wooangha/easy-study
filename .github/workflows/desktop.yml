# Desktop app (DESIGN §19): Tauri 2 shell + official Node runtime + the packed server, for macOS (arm64, x64),
# Windows (x64) and Linux (x64, arm64), with the recording tools of DESIGN §22 (whisper.cpp's whisper-cli and a
# minimal LGPL ffmpeg, built here for every target and cached). The repo's tests run first. Bundles are uploaded as
# workflow artifacts; the x86_64 Linux bundles are also tested on current Arch Linux, which builds the Arch package.
# A `v*` tag also creates a DRAFT GitHub release with all of them (and FFmpeg's source). Unsigned by default (macOS ad-hoc signature, no
# notarization; unsigned Windows installer): macOS signing and notarization turn on when the APPLE_* secrets exist.
# In-app updates (DESIGN §24): the macOS builds also pack the .app as the updater's .app.tar.gz; the Windows installer
# and the AppImages serve the updater as they are. Nothing is signed for the updater here and no updater key is ever
# in CI: desktop/scripts/publish-release.mjs checks the draft, signs on the maintainer's Mac and publishes to
# Wooangha/easy-study-releases with latest.json. Actions are pinned by commit (the tag in the comment).
# Caches (Rust target dirs, whisper-cli, ffmpeg) are per git ref: a run restores its own ref's caches or main's, so
# a `v*` tag run is only warm when main was built after the last change (`gh workflow run desktop.yml --ref main`
# after merging, before tagging). Only main's runs save the large Rust caches: branch and tag runs would only fill
# the repository's 10 GB cache quota with copies nobody restores (and evict main's).
# (A secret that is not configured arrives as an empty variable; desktop/scripts/build.mjs drops empty APPLE_*
# variables, which the Tauri CLI would otherwise take as the signing identity "" and as notarization credentials.)
name: desktop

on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'desktop/**'
      - 'packaging/**'
      - '.github/workflows/desktop.yml'

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  # `secrets` cannot be used in `if:`; expose "is it configured" as plain env instead.
  HAS_APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}

jobs:
  test:
    name: repo tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run desktop:test # desktop/ configuration invariants (IPC only for the chooser, targets, bundles)
      # The shell's Rust unit tests, here beside the builds (not on their critical path): the Linux build
      # dependencies of the Tauri crate, then cargo test in the dev profile (its own cache key).
      - name: Linux build dependencies (Tauri crate)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: desktop/src-tauri -> target
          key: unit-tests
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # tauri-build checks that the bundle's resources and sidecars exist; the unit tests need none of them
      # (prepare.mjs makes them in the build jobs), so the bundle lists are emptied for this compile only.
      - name: Rust unit tests
        env:
          TAURI_CONFIG: '{"bundle":{"externalBin":[],"resources":[]}}'
        run: cargo test --manifest-path desktop/src-tauri/Cargo.toml

  # The minimal LGPL ffmpeg of the recording tools (DESIGN §22; desktop/scripts/ffmpeg.mjs, build-ffmpeg.sh) for every
  # target, cached until its sources, flags or scripts change: macOS on macOS; Linux in alpine containers of the
  # target's architecture (static musl binaries: every distribution, the AppImage, Arch); Windows cross-built with
  # mingw-w64 in an ubuntu:22.04 container (a separate program: the app's MSVC ABI does not matter). The build job
  # takes it as an artifact.
  ffmpeg:
    name: ffmpeg ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-apple-darwin
            runner: macos-latest # cross-compiled
          - target: x86_64-pc-windows-msvc
            runner: ubuntu-22.04 # mingw-w64
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 26
      - uses: actions/cache@a7833574556fa59680c1b7cb190c1735db73ebf0 # v5.0.0
        id: cache
        with:
          path: .cache/ffmpeg/${{ matrix.target }}
          key: ffmpeg-${{ matrix.target }}-${{ hashFiles('desktop/scripts/build-ffmpeg.sh', 'desktop/scripts/ffmpeg-min.flags', 'desktop/scripts/ffmpeg.mjs') }}
      - name: pkg-config (libopus) and nasm (x86 assembly of the Intel Mac build)
        if: steps.cache.outputs.cache-hit != 'true' && runner.os == 'macOS'
        run: brew install pkgconf nasm
      # Reuses the cache when its stamp matches, else downloads the sources (SHA-256 checked) and builds.
      - name: Build
        run: node desktop/scripts/ffmpeg.mjs --target ${{ matrix.target }}
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ffmpeg-${{ matrix.target }}
          path: .cache/ffmpeg/${{ matrix.target }}
          include-hidden-files: true # the path is under .cache
          if-no-files-found: error
      # LGPL-2.1: the complete corresponding source goes into every release, next to the app (THIRD_PARTY_NOTICES.md).
      - name: FFmpeg source for the release
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: node desktop/scripts/ffmpeg.mjs --source-bundle "$RUNNER_TEMP/ffmpeg-source"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        with:
          name: easy-study-ffmpeg-source
          path: ${{ runner.temp }}/ffmpeg-source/*.tar
          if-no-files-found: error

  build:
    # Only the ffmpeg artifacts: the repo tests run beside the builds, and the release waits for both.
    needs: [ffmpeg]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            runner: macos-latest # Apple silicon
            target: aarch64-apple-darwin
            smoke: true
          - name: macos-x64
            runner: macos-latest # cross-compiled on Apple silicon (runs under Rosetta)
            target: x86_64-apple-darwin
            smoke: false
          - name: windows-x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            smoke: true
          - name: linux-x64
            runner: ubuntu-22.04 # the oldest glibc we support; the AppImage bundles its libraries from here
            target: x86_64-unknown-linux-gnu
            smoke: true
          - name: linux-arm64
            runner: ubuntu-22.04-arm # native: ARM AppImages cannot be cross-built
            target: aarch64-unknown-linux-gnu
            smoke: true
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    env:
      BUNDLE: desktop/src-tauri/target/${{ matrix.target }}/release/bundle
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      # rustup comes with GitHub's runners: no third-party action that follows a branch (this job gets the
      # APPLE_* secrets once they are configured). Every action is pinned by commit.
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: desktop/src-tauri -> target
          key: ${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Linux build dependencies (v2.tauri.app/start/prerequisites; xdg-utils for the AppImage, squashfs-tools for appimage.mjs) + Xvfb, espeak-ng (ASR check)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev xdg-utils squashfs-tools xvfb espeak-ng cmake

      - run: npm ci
      - run: npm ci
        working-directory: desktop

      # The recording tools (DESIGN §22): ffmpeg from the ffmpeg job; whisper.cpp's whisper-cli built here with this
      # runner's compiler (MSVC on Windows; Metal on Apple silicon, CPU elsewhere) and cached until its version,
      # flags or checks change. prepare.mjs puts both next to Node in the bundle.
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ffmpeg-${{ matrix.target }}
          path: .cache/ffmpeg/${{ matrix.target }}
      - uses: actions/cache@a7833574556fa59680c1b7cb190c1735db73ebf0 # v5.0.0
        with:
          path: |
            .cache/whisper/${{ matrix.target }}/bin
            .cache/whisper/${{ matrix.target }}/stamp.json
          key: whisper-${{ matrix.target }}-${{ hashFiles('desktop/scripts/whisper.mjs', 'desktop/scripts/binaries.mjs') }}
      - name: whisper.cpp (whisper-cli)
        run: node desktop/scripts/whisper.mjs --target ${{ matrix.target }}

      # web/dist + dist-server, then the official Node runtime (SHASUMS256-checked), the packed server with
      # production node_modules for THIS target (sharp's @img/sharp-<os>-<cpu>) and the recording tools
      # (--require-tools: a bundle without them fails here).
      - name: Build and prepare resources
        run: node desktop/scripts/prepare.mjs --target ${{ matrix.target }} --require-tools

      # macOS signing (optional). Nested Mach-O files in Resources must be signed BEFORE the bundle is: Tauri
      # signs only the app binary and the bundle. Node's own signature carries get-task-allow, which
      # notarization rejects, so it is re-signed with node.entitlements. whisper-cli and ffmpeg need no entitlement
      # (no JIT, no microphone: the app itself has com.apple.security.device.audio-input, app.entitlements).
      - name: Import signing certificate (macOS)
        if: runner.os == 'macOS' && env.HAS_APPLE_CERT == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import "$RUNNER_TEMP/cert.p12" -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci build.keychain
          rm "$RUNNER_TEMP/cert.p12"
      - name: Sign the bundled Node and native addons (macOS)
        if: runner.os == 'macOS' && env.HAS_APPLE_CERT == 'true'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          codesign --force --timestamp --options runtime --entitlements desktop/src-tauri/node.entitlements \
            --sign "$APPLE_SIGNING_IDENTITY" desktop/resources/node/bin/node
          find desktop/resources/server/node_modules \( -name '*.node' -o -name '*.dylib' \) -print0 |
            xargs -0 codesign --force --timestamp --options runtime --sign "$APPLE_SIGNING_IDENTITY"
          codesign --force --timestamp --options runtime --sign "$APPLE_SIGNING_IDENTITY" \
            desktop/resources/whisper/whisper-cli desktop/resources/ffmpeg/ffmpeg

      - name: tauri build
        env: # empty when not configured: build.mjs drops empty APPLE_* variables (ad-hoc signature, no notarization)
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: node desktop/scripts/build.mjs --target ${{ matrix.target }} --skip-prepare --require-tools

      # The recorder records in the app's WKWebView: without NSMicrophoneUsageDescription it has no
      # navigator.mediaDevices, and under the hardened runtime (on even when signed ad hoc) macOS denies the
      # microphone without the audio-input entitlement.
      - name: Microphone description and entitlement (macOS)
        if: runner.os == 'macOS'
        run: |
          app="$BUNDLE/macos/easy-study.app"
          plutil -extract NSMicrophoneUsageDescription raw "$app/Contents/Info.plist"
          codesign -d --entitlements - "$app" > "$RUNNER_TEMP/entitlements.txt"
          grep com.apple.security.device.audio-input "$RUNNER_TEMP/entitlements.txt"
          codesign -dv "$app" 2>&1 | grep -E '^CodeDirectory .*flags=.*runtime'
          test -x "$app/Contents/Resources/whisper/whisper-cli" && test -x "$app/Contents/Resources/ffmpeg/ffmpeg"

      # The in-app updater's macOS artifact (DESIGN §24): the .app as built (not re-signed) in a .tar.gz with exactly
      # one top folder, since tauri-plugin-updater drops the first path segment of every entry ("-C dir ." would add a
      # "./"). tar-rs resolves hard-link targets against the process's working folder, so a hard link would break every
      # install. No "._" AppleDouble files (COPYFILE_DISABLE) and no extended attributes. It is signed later, by
      # publish-release.mjs. No `! cmd` checks: bash -e does not stop on a negated command.
      - name: Updater archive (macOS)
        if: runner.os == 'macOS'
        run: |
          v=$(node -p "require('./package.json').version")
          case "${{ matrix.target }}" in aarch64-*) a=aarch64 ;; *) a=x64 ;; esac
          app="$BUNDLE/macos/easy-study.app"
          test "$(plutil -extract CFBundleShortVersionString raw "$app/Contents/Info.plist")" = "$v"
          if [ -n "$(find "$app" -type f -links +1)" ]; then echo '::error::hard links in the bundle'; exit 1; fi
          out="$BUNDLE/macos/easy-study_${v}_${a}.app.tar.gz"
          COPYFILE_DISABLE=1 tar --no-xattrs -czf "$out" -C "$BUNDLE/macos" easy-study.app
          tar -tzf "$out" > "$RUNNER_TEMP/applist.txt"
          grep -qx 'easy-study\.app/Contents/Info\.plist' "$RUNNER_TEMP/applist.txt"
          if grep -qv '^easy-study\.app/' "$RUNNER_TEMP/applist.txt" || grep -q -e '/\._' -e '^\._' "$RUNNER_TEMP/applist.txt"; then
            echo '::error::the updater archive must hold easy-study.app/ only, without AppleDouble files'
            exit 1
          fi
          ls -l "$out"

      # build.mjs has taken the libraries out of the AppImage that must come from the user's system
      # (desktop/scripts/appimage.mjs: libwayland-client, which the user's Mesa needs in its own version).
      - name: AppImage without host libraries (Linux)
        if: runner.os == 'Linux'
        run: node desktop/scripts/appimage.mjs --check "$BUNDLE"/appimage/*.AppImage

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: easy-study-${{ matrix.name }}
          path: |
            ${{ env.BUNDLE }}/dmg/*.dmg
            ${{ env.BUNDLE }}/macos/*.app.tar.gz
            ${{ env.BUNDLE }}/nsis/*.exe
            ${{ env.BUNDLE }}/deb/*.deb
            ${{ env.BUNDLE }}/rpm/*.rpm
            ${{ env.BUNDLE }}/appimage/*.AppImage
          if-no-files-found: error

      # Smoke tests (EASY_STUDY_DESKTOP_SMOKE, src-tauri/src/main.rs): =chooser-local submits the chooser's own
      # form (IPC, script, styles, connect_local), =1 starts the server the way a remembered choice does. The
      # bundled server starts in desktop mode, its page renders, /api/health answers, the page has no IPC, a
      # PDF uploads, converts and its slide images load, the page has what the lecture recorder needs (a secure
      # context with getUserMedia and AudioWorklet; the microphone is never opened) and GET /api/asr finds the
      # whisper-cli and ffmpeg the shell passed; nothing is left running afterwards. The library is in a dot folder, like the Linux default
      # (~/.local/share/…). No claude/codex CLI on the runners: that is fine.
      # Then the ASR check (desktop/scripts/asr-smoke.mjs) runs the bundle's own whisper-cli and ffmpeg: the upload
      # conversion, and a transcription with a small model (cached below) of speech from the runner's text-to-speech
      # (a generated tone where there is none). No microphone is involved anywhere.
      - uses: actions/cache@a7833574556fa59680c1b7cb190c1735db73ebf0 # v5.0.0
        if: matrix.smoke
        with:
          path: .cache/asr-smoke
          key: asr-smoke-${{ hashFiles('desktop/scripts/asr-smoke.mjs') }}
      - name: Smoke test (macOS)
        if: matrix.smoke && runner.os == 'macOS'
        run: |
          app="$BUNDLE/macos/easy-study.app/Contents/MacOS/easy-study"
          export EASY_STUDY_DESKTOP_HOME="$RUNNER_TEMP/es-home" EASY_STUDY_DESKTOP_LIBRARY="$RUNNER_TEMP/.es/library"
          EASY_STUDY_DESKTOP_SMOKE=chooser-local EASY_STUDY_DESKTOP_SMOKE_TIMEOUT=180 "$app"
          EASY_STUDY_DESKTOP_SMOKE=1 EASY_STUDY_DESKTOP_SMOKE_TIMEOUT=180 "$app"
          sleep 1
          if pgrep -f 'dist-server/server/index.js'; then exit 1; fi # (BSD pgrep: -a would match ancestors)
          res="$BUNDLE/macos/easy-study.app/Contents/Resources"
          node desktop/scripts/asr-smoke.mjs --whisper "$res/whisper/whisper-cli" --ffmpeg "$res/ffmpeg/ffmpeg"
      - name: Smoke test (Linux, installed .deb)
        if: matrix.smoke && runner.os == 'Linux'
        run: |
          sudo apt-get install -y ./"$BUNDLE"/deb/*.deb
          export EASY_STUDY_DESKTOP_HOME="$RUNNER_TEMP/es-home" EASY_STUDY_DESKTOP_LIBRARY="$RUNNER_TEMP/.es/library"
          EASY_STUDY_DESKTOP_SMOKE=chooser-local EASY_STUDY_DESKTOP_SMOKE_TIMEOUT=180 xvfb-run -a easy-study
          EASY_STUDY_DESKTOP_SMOKE=1 EASY_STUDY_DESKTOP_SMOKE_TIMEOUT=180 xvfb-run -a easy-study
          sleep 1
          if pgrep -af 'dist-server/server/index.js'; then exit 1; fi
          node desktop/scripts/asr-smoke.mjs --whisper /usr/bin/es-whisper --ffmpeg /usr/bin/es-ffmpeg
      # With FUSE the AppImage runs from /tmp/.mount_<name>…, a dot folder; extracted into one, it runs from the
      # same kind of path without FUSE on the runner. (linuxdeploy rewrites the ELF files it bundles: the ASR check
      # runs the AppImage's own copies.)
      - name: Smoke test (Linux, AppImage from a dot folder)
        if: matrix.smoke && runner.os == 'Linux'
        run: |
          appimage=$(find "$GITHUB_WORKSPACE/$BUNDLE/appimage" -name '*.AppImage' | head -n 1)
          mkdir -p "$RUNNER_TEMP/.mount_easy-study" && cd "$RUNNER_TEMP/.mount_easy-study"
          "$appimage" --appimage-extract >/dev/null
          export EASY_STUDY_DESKTOP_HOME="$RUNNER_TEMP/es-home-appimage" EASY_STUDY_DESKTOP_LIBRARY="$RUNNER_TEMP/.es-appimage/library"
          EASY_STUDY_DESKTOP_SMOKE=1 EASY_STUDY_DESKTOP_SMOKE_TIMEOUT=180 xvfb-run -a ./squashfs-root/AppRun
          sleep 1
          if pgrep -af 'dist-server/server/index.js'; then exit 1; fi
          node "$GITHUB_WORKSPACE/desktop/scripts/asr-smoke.mjs" --whisper squashfs-root/usr/bin/es-whisper \
            --ffmpeg squashfs-root/usr/bin/es-ffmpeg --models "$GITHUB_WORKSPACE/.cache/asr-smoke"
      - name: Smoke test (Windows)
        if: matrix.smoke && runner.os == 'Windows'
        shell: pwsh
        run: |
          $release = "desktop\src-tauri\target\${{ matrix.target }}\release"
          $exe = "$release\easy-study.exe"
          $env:EASY_STUDY_DESKTOP_HOME = "$env:RUNNER_TEMP\es-home"
          $env:EASY_STUDY_DESKTOP_LIBRARY = "$env:RUNNER_TEMP\.es\library"
          foreach ($mode in @('chooser-local', '1')) {
            $env:EASY_STUDY_DESKTOP_SMOKE = $mode
            $env:EASY_STUDY_DESKTOP_SMOKE_TIMEOUT = '180'
            $p = Start-Process -FilePath $exe -Wait -PassThru
            Get-Content "$env:EASY_STUDY_DESKTOP_HOME\logs\shell.log" -Tail 8
            if ($p.ExitCode -ne 0) { throw "smoke ($mode) exited with $($p.ExitCode)" }
          }
          node desktop/scripts/asr-smoke.mjs --whisper "$release\whisper\whisper-cli.exe" --ffmpeg "$release\ffmpeg\ffmpeg.exe"
          if ($LASTEXITCODE -ne 0) { throw "ASR smoke failed" }

  # The Linux bundles are built on Ubuntu 22.04, where the libraries inside the AppImage are the system's own. On a
  # rolling distribution they meet a newer Mesa, Wayland… (v0.2.1's AppImage opened a blank window on Arch:
  # appimage.mjs). So this build's x86_64 AppImage runs here on current Arch Linux (--appimage-extract-and-run: no
  # FUSE in a container), and packaging/arch/PKGBUILD is built from this build's .deb files, installed, smoke-tested
  # and removed. The package and the PKGBUILD with this build's checksums go into the release (the repository's
  # PKGBUILD keeps the last release's). As a normal user: root is not how the app runs, and makepkg refuses it.
  arch:
    name: arch-x64
    needs: build
    runs-on: ubuntu-latest
    container: archlinux:latest
    defaults:
      run:
        shell: bash # -eo pipefail
    steps:
      - name: Packages
        run: |
          # pacman's syscall sandbox fails under x86_64 emulation (Rosetta, where this job was tried out); harmless here.
          sed -i '0,/^\[options\]/s//&\nDisableSandboxSyscalls/' /etc/pacman.conf
          # nodejs + espeak-ng: the ASR check of the package's es-whisper and es-ffmpeg.
          pacman -Syu --noconfirm --needed base-devel namcap pacman-contrib xorg-server-xvfb fontconfig fribidi harfbuzz \
            nodejs espeak-ng
          useradd -m tester

      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: easy-study-linux-*
          path: dist
          merge-multiple: true
      - uses: actions/cache@a7833574556fa59680c1b7cb190c1735db73ebf0 # v5.0.0
        with:
          path: .cache/asr-smoke
          key: asr-smoke-${{ hashFiles('desktop/scripts/asr-smoke.mjs') }}

      - name: Smoke test (AppImage)
        run: |
          # Artifacts do not keep the executable bit.
          install -m 755 -o tester -g tester "$(find dist -name '*_amd64.AppImage' | head -n 1)" /home/tester/easy-study.AppImage
          for mode in chooser-local 1; do
            runuser -u tester -- env EASY_STUDY_DESKTOP_HOME=/tmp/es-home-appimage EASY_STUDY_DESKTOP_LIBRARY=/tmp/.es-appimage/library \
              EASY_STUDY_DESKTOP_SMOKE=$mode EASY_STUDY_DESKTOP_SMOKE_TIMEOUT=180 \
              xvfb-run -a /home/tester/easy-study.AppImage --appimage-extract-and-run
          done
          sleep 1
          if pgrep -af 'dist-server/server/index.js'; then exit 1; fi

      - name: Arch package (packaging/arch/PKGBUILD)
        run: |
          version=$(sed -n 's/^  "version": "\([^"]*\)",$/\1/p' package.json)
          [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "no version in package.json: '$version'"; exit 1; }
          work=/home/tester/pkg
          install -d -o tester -g tester "$work"
          install -m 644 -o tester -g tester packaging/arch/PKGBUILD dist/deb/*.deb "$work"/
          cd "$work"
          sed -i "s/^pkgver=.*/pkgver=$version/; s/^pkgrel=.*/pkgrel=1/" PKGBUILD
          runuser -u tester -- updpkgsums
          # -d: package() only unpacks the .deb; pacman -U installs the dependencies, as for a user.
          runuser -u tester -- makepkg -f -d
          pacman -U --noconfirm ./*.pkg.tar.zst
          # After the install: namcap finds the packages of the linked libraries only among installed ones.
          namcap PKGBUILD ./*.pkg.tar.zst | tee namcap.txt
          if grep -F ' E: ' namcap.txt; then exit 1; fi

      - name: Smoke test (Arch package)
        run: |
          for mode in chooser-local 1; do
            runuser -u tester -- env EASY_STUDY_DESKTOP_HOME=/tmp/es-home-pkg EASY_STUDY_DESKTOP_LIBRARY=/tmp/.es-pkg/library \
              EASY_STUDY_DESKTOP_SMOKE=$mode EASY_STUDY_DESKTOP_SMOKE_TIMEOUT=180 xvfb-run -a easy-study
          done
          sleep 1
          if pgrep -af 'dist-server/server/index.js'; then exit 1; fi
          node desktop/scripts/asr-smoke.mjs --whisper /usr/bin/es-whisper --ffmpeg /usr/bin/es-ffmpeg
          pacman -R --noconfirm easy-study-bin
          test ! -e /usr/bin/easy-study && test ! -e /usr/bin/es-node && test ! -e /usr/lib/easy-study
          test ! -e /usr/bin/es-whisper && test ! -e /usr/bin/es-ffmpeg

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: easy-study-arch-x64
          path: |
            /home/tester/pkg/*.pkg.tar.zst
            /home/tester/pkg/PKGBUILD
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, build, arch]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The bundles (with the macOS updater archives), the Arch package and the FFmpeg source (not the
      # ffmpeg-<target> build artifacts).
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: easy-study-*
          path: dist
          merge-multiple: true
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Every bundle kind comes in its own folder (dist/dmg, dist/nsis, dist/deb…): gh takes files, not folders.
          mapfile -t files < <(find dist -type f | sort)
          printf '%s\n' "${files[@]}"
          gh release create "$GITHUB_REF_NAME" "${files[@]}" --repo "$GITHUB_REPOSITORY" --draft --generate-notes \
            --title "easy-study $GITHUB_REF_NAME"
